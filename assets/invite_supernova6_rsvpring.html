<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy hour</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #070b16;
      --cyan: #5fd4ff;
      --lilac: #c9b8ff;
    }

    html {
      background-color: var(--night);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--night);
      background-image: url("https://sonic-beryl-7zlowfy.vercel.app/assets/posters/science-supernova-6-sky-uniform.jpg");
      background-repeat: repeat-y;
      background-position: center top;
      background-size: 100% auto;
      color: #ffffff;
    }

    main {
      box-sizing: border-box;
      width: min(100%, 40rem);
      margin: 0 auto;
      padding: clamp(1.75rem, 5vw, 2.75rem) clamp(1rem, 4vw, 1.75rem) clamp(2rem, 6vw, 3.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .mascot {
      width: 96px;
      height: 96px;
      border: 3px solid var(--cyan);
      border-radius: 50%;
      background: #0d1530;
      object-fit: cover;
      box-shadow: 0 0 16px 4px var(--cyan);
    }

    h1 {
      margin: 1.35rem 0 0;
      max-width: 22ch;
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(1.4rem, 1.2vw + 1.15rem, 1.7rem);
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 0 1px 3px #000000;
    }

    .come,
    .ask {
      margin: 1.15rem 0 0;
      max-width: 36rem;
      font-family: Pushkin, "Trebuchet MS", "Lucida Grande", "Lucida Sans Unicode", sans-serif;
      font-weight: 400;
      line-height: 1.45;
      text-shadow: 0 1px 3px #000000;
    }

    .come {
      color: var(--lilac);
      font-size: clamp(15px, 0.18vw + 14.6px, 17px);
    }

    .ask {
      color: #ffffff;
      font-size: clamp(16px, 0.23vw + 15.4px, 18.3px);
    }

    .rsvp {
      margin-top: 1.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3.25rem;
      padding: 0.8rem 2.4rem;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      text-decoration: none;
      background: transparent;
      border: 3px solid var(--cyan);
      border-radius: 999px;
      box-shadow: 0 0 16px 4px var(--cyan);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .rsvp:hover {
      box-shadow: 0 0 10px 2px var(--cyan), 0 0 32px 10px var(--cyan);
      transform: translateY(-2px);
    }

    .rsvp:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
      box-shadow: 0 0 10px 2px var(--cyan), 0 0 32px 10px var(--cyan);
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 1.6rem;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .rsvp {
        transition: none;
      }

      .rsvp:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="mascot" src="https://sonic-beryl-7zlowfy.vercel.app/assets/images/icon.png" width="96" height="96" alt="Anime mascot.">
    <h1>The Barozzi and Tardito labs invite you to our Happy hour!</h1>
    <p class="come">Come as you are or come as you aren't. Casual earthling, full extraterrestrial, or something in between - all life forms welcome.</p>
    <p class="ask">Please fill in the RSVP if you want to attend so we can buy enough drinks until October 26th.</p>
    <a class="rsvp" href="https://s2survey.net/ccr/?r=mail">RSVP</a>
    <img class="poster" src="https://sonic-beryl-7zlowfy.vercel.app/assets/posters/science-supernova-6-1200.jpg" width="1200" height="1697" alt="Five friends toast around a glowing blue fountain under a nebula outside the CCR container.">
  </main>
</body>
</html>
