<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Happy hour RSVP</title>
  <!-- The names list is retired. Old links go to the SoSci questionnaire, or to the invite while HH_SOSCI_URL is empty. -->
  <script src="../assets/hh-config.js"></script>
  <script>
    (function () {
      var raw = String((window.HH_CONFIG || {}).HH_SOSCI_URL || "").trim();
      var target = "happy_hour_preview.html#rsvp";
      try {
        var url = new URL(raw);
        if (url.protocol === "https:" && !/\[[A-Z][A-Z0-9_]*\]/.test(raw)) {
          url.searchParams.set("r", "mail");
          target = url.href;
        }
      } catch (err) { /* not configured */ }
      location.replace(target);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=happy_hour_preview.html#rsvp"></noscript>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #f7f3ea;
      color: #1b1730;
      font-family: Outfit, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(40rem, calc(100% - 2rem));
      margin: 2.5rem auto 3rem;
    }
  </style>
</head>
<body>
  <main>
    <p>The names list has moved. Please RSVP using the form on the <a href="happy_hour_preview.html#rsvp">invitation</a>.</p>
  </main>
</body>
</html>
